       transform="translate(4.4659054e-4,15.610046)"><tspan
         x="-30.790973"
         y="0.47616991"><tspan
           style="font-size:9.525px;text-align:center;text-anchor:middle;fill:#000000;fill-opacity:1;stroke-width:0.264583">There are two trees: blue and orange, each containing mostly apples </tspan></tspan><tspan
         x="8.662431"
         y="12.38242"><tspan
           style="font-size:9.525px;text-align:center;text-anchor:middle;fill:#000000;fill-opacity:1;stroke-width:0.264583">of their own color but also some of the other color.
</tspan></tspan><tspan
         x="114.02344"
         y="24.28867"><tspan
           style="font-size:9.525px;text-align:center;text-anchor:middle;fill:#000000;fill-opacity:1;stroke-width:0.264583">
</tspan></tspan><tspan
         x="-30.51192"
         y="36.19492"><tspan
           style="font-size:9.525px;text-align:center;text-anchor:middle;fill:#000000;fill-opacity:1;stroke-width:0.264583">The computer picks apples from one of the two trees for a while, and </tspan></tspan><tspan
         x="-29.718946"
         y="48.10117"><tspan
           style="font-size:9.525px;text-align:center;text-anchor:middle;fill:#000000;fill-opacity:1;stroke-width:0.264583">occasionally switches to the other tree. On each trial, you are shown </tspan></tspan><tspan
         x="-25.21922"
         y="60.00742"><tspan
           style="font-size:9.525px;text-align:center;text-anchor:middle;fill:#000000;fill-opacity:1;stroke-width:0.264583">a sample of apples that the computer picked from the current tree.
</tspan></tspan><tspan
         x="112.70026"
         y="71.91367"><tspan
           style="font-size:9.525px;text-align:center;text-anchor:middle;fill:#000000;fill-opacity:1;stroke-width:0.264583"> 
</tspan></tspan><tspan
         x="-17.808045"
         y="83.81992"><tspan
           style="font-size:9.525px;text-align:center;text-anchor:middle;fill:#000000;fill-opacity:1;stroke-width:0.264583">Based on the current sample and your memory of the previous </tspan></tspan><tspan
         x="-30.237519"
         y="95.72617"><tspan
           style="font-size:9.525px;text-align:center;text-anchor:middle;fill:#000000;fill-opacity:1;stroke-width:0.264583">samples, your goal is to identify from which tree the computer is now </tspan></tspan><tspan
         x="-31.044446"
         y="107.63242"><tspan
           style="font-size:9.525px;text-align:center;text-anchor:middle;fill:#000000;fill-opacity:1;stroke-width:0.264583">picking apples, and report this using the buttons </tspan><tspan
           style="font-weight:bold;font-size:9.525px">[E]</tspan><tspan
           style="font-size:9.525px;text-align:center;text-anchor:middle;fill:#000000;fill-opacity:1;stroke-width:0.264583"> or </tspan><tspan
           style="font-weight:bold;font-size:9.525px">[P]</tspan><tspan
           style="font-size:9.525px;text-align:center;text-anchor:middle;fill:#000000;fill-opacity:1;stroke-width:0.264583"> (when you </tspan></tspan><tspan
         x="-14.080366"
         y="119.53867"><tspan
           style="font-size:9.525px;text-align:center;text-anchor:middle;fill:#000000;fill-opacity:1;stroke-width:0.264583">are relatively confident) or </tspan><tspan
           style="font-weight:bold;font-size:9.525px">[R]</tspan><tspan
           style="font-size:9.525px;text-align:center;text-anchor:middle;fill:#000000;fill-opacity:1;stroke-width:0.264583"> or </tspan><tspan
           style="font-weight:bold;font-size:9.525px">[O] </tspan><tspan
           style="font-size:9.525px;text-align:center;text-anchor:middle;fill:#000000;fill-opacity:1;stroke-width:0.264583">(when you are relatively </tspan></tspan><tspan
