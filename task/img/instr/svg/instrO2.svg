</tspan></tspan><tspan
         x="-26.831644"
         y="70.097849"><tspan
           style="font-size:10.9361px;text-align:center;text-anchor:middle;fill:#000000;fill-opacity:1;stroke-width:0.264583">That is, if the button </tspan><tspan
           style="font-weight:bold;font-size:10.9361px">[E]</tspan><tspan
           style="font-size:10.9361px;text-align:center;text-anchor:middle;fill:#000000;fill-opacity:1;stroke-width:0.264583"> was previously picking apples from </tspan></tspan><tspan
