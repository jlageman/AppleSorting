           style="font-size:10.9361px;text-align:center;text-anchor:middle;fill:#000000;fill-opacity:1;stroke-width:0.264583">while the other action picks apples from the </tspan><tspan
           style="fill:#df8d00;fill-opacity:1">orange</tspan><tspan
           style="font-size:10.9361px;text-align:center;text-anchor:middle;fill:#000000;fill-opacity:1;stroke-width:0.264583"> tree. This </tspan></tspan><tspan
